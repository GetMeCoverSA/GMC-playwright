name: GMC playwright tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install ts-node & tsx
        run: npm install ts-node tsx

      - name: Run Playwright tests
        run: npx playwright test

      - name: Debug Allure results
        run: ls -la allure-results

      - name: Generate Allure report (Single File)
        run: npx allure generate --single-file ./allure-results -o allure-report

      - name: Generate Full Allure report
        run: npx allure generate ./allure-results -o full-allure-report

      - name: Ensure Allure report directories exist
        run: mkdir -p allure-report full-allure-report

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 30

      - name: Upload Allure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-reports
          path: |
            allure-report/
            full-allure-report/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Send Teams Notification
        if: always()
        run: npx tsx send_webhook_teams.ts